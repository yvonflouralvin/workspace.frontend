# docker-compose.yml — app auth seule, build + start production
# Usage : docker compose up --build
name: ft_auth

services:
  workspace_uat_ft_auth:
    image: node:24-alpine
    container_name: workspace_uat_ft_auth
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ft_auth_node_modules:/app/node_modules
    env_file: ./.env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    command: sh -c "npm ci && cd apps/auth && npx next build && exec node .next/standalone/apps/auth/server.js"
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  ft_auth_node_modules:

networks:
  dokploy-network:
    external: true