# docker-compose.yml — app auth seule, build + start production
# Usage : docker compose up --build
name: wd_ft_auth

services:
  wd_ft_auth:
    image: node:24-alpine
    container_name: wd_ft_auth
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ft_auth_node_modules:/app/node_modules
      - ft_auth_auth_node_modules:/app/apps/auth/node_modules
    env_file: ./.env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    command: >-
      sh -c "npm ci &&
      npx turbo run build --filter=auth &&
      cp -r apps/auth/.next/static apps/auth/.next/standalone/apps/auth/.next/static &&
      cp -r apps/auth/public apps/auth/.next/standalone/apps/auth/public &&
      exec node apps/auth/.next/standalone/apps/auth/server.js"
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  ft_auth_node_modules:
  ft_auth_auth_node_modules:

networks:
  dokploy-network:
    external: true