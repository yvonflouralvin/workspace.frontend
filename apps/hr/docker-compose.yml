# docker-compose.yml — app hr seule, build + start production
# Usage : docker compose up --build
name: ft_hr

services:
  hr_uat_ft_hr:
    image: node:24-alpine
    container_name: hr_uat_ft_hr
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ft_hr_node_modules:/app/node_modules
      - ft_hr_hr_node_modules:/app/apps/hr/node_modules
    env_file: ./.env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    command: >-
      sh -c "npm ci &&
      npx turbo run build --filter=hr &&
      cp -r apps/hr/.next/static apps/hr/.next/standalone/apps/hr/.next/static &&
      cp -r apps/hr/public apps/hr/.next/standalone/apps/hr/public &&
      exec node apps/hr/.next/standalone/apps/hr/server.js"
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  ft_hr_node_modules:
  ft_hr_hr_node_modules:

networks:
  dokploy-network:
    external: true