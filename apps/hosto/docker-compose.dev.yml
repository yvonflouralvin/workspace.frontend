# docker-compose.dev.yml — app hosto seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: wd_ft_hosto

services:
  wd_ft_hosto:
    image: node:24-alpine
    container_name: wd_ft_hosto
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ../../node_modules:/app/node_modules
      - hosto_next:/app/apps/hosto/.next
    env_file: ./.env
    environment:
      PORT: "3007"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://wd_bk_auth:4999
      HOSTO_API_URL: http://wd_bk_hosto:5007
      HR_API_URL: http://wd_bk_hr:5001
    command: sh -c "[ ! -d node_modules/.bin ] && npm ci; cd apps/hosto && exec npx next dev --port 3007"
    ports:
      - "3007:3007"
    networks:
      - workspace_dev

networks:
  workspace_dev:
    name: workspace_dev
    external: true

volumes:
  hosto_next:
