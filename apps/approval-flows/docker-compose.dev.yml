# docker-compose.dev.yml — app approval-flows seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: wd_ft_approval_flows

services:
  wd_ft_approval_flows:
    image: node:24-alpine
    container_name: wd_ft_approval_flows
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ../../node_modules:/app/node_modules
      - approval_flows_next:/app/apps/approval-flows/.next
    env_file: ./.env
    environment:
      PORT: "3006"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://wd_bk_auth:4999
      APPROVAL_FLOWS_API_URL: http://wd_bk_approval_flows:5005
    command: sh -c "[ ! -d node_modules/.bin ] && npm ci; cd apps/approval-flows && exec npx next dev --port 3006"
    ports:
      - "3006:3006"
    networks:
      - workspace_dev

networks:
  workspace_dev:
    name: workspace_dev
    external: true

volumes:
  approval_flows_next:
