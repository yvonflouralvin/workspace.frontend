# docker-compose.dev.yml — app auth seule, hot reload (next dev)
# Premier démarrage : docker compose -f docker-compose.dev.yml build
# Usage             : docker compose -f docker-compose.dev.yml up
name: ft_auth

services:
  ft_auth:
    build:
      context: ../../
      dockerfile: Dockerfile.dev
    container_name: dev_ft_auth
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - /app/node_modules
    env_file: ./.env
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      WORKSPACE_APP_URL: http://localhost:3005
    command: sh -c "cd apps/auth && exec npx next dev --port 3001"
    ports:
      - "3001:3001"
    networks:
      - dev

networks:
  dev:
    name: dev
    external: true
