name: Publier l'image Docker — auth

# Pilote CI/CD image : monorepo, donc un tag préfixé par app (`auth-v1.2.3`) pour ne
# construire que l'app concernée. Le préfixe `auth-` isole le pilote — les autres
# apps recevront leur propre workflow une fois celui-ci validé.
on:
  push:
    tags:
      - "auth-v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wd-ft-auth
          tags: |
            type=match,pattern=auth-v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
