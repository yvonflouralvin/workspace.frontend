# docker-compose.dev.yml — app workspace seule, hot reload (next dev)
# Prérequis : docker compose -f docker-compose.postgres.dev.yml up -d (workspace root)
# Usage    : docker compose -f frontends/apps/workspace/docker-compose.dev.yml up

services:
  ft_workspace:
    image: node:24-alpine
    container_name: dev_ft_workspace
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - frontends_nm:/app/node_modules
    env_file: ./.env
    environment:
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      AUDIT_LOGS_API_URL: http://dev_audit_logs:5006
    command:
      - sh
      - -c
      - |
        [ ! -d node_modules/.bin ] && npm ci
        exec npx next dev --port 3005
    ports:
      - "3005:3005"
    networks:
      - dev

networks:
  dev:
    name: dev
    external: true

volumes:
  frontends_nm:
    name: frontends_nm
