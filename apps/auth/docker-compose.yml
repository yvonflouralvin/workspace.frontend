# docker-compose.dev.yml — app auth seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: ft_auth

services:
  workspace_uat_ft_auth:
    image: node:24-alpine
    container_name: workspace_uat_ft_auth
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
    env_file: ./.env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0" 
    command: sh -c "[ ! -d node_modules/.bin ] && npm ci; cd apps/auth && exec npx next build && exec npx next start --hostname 0.0.0.0 --port 3000"
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true  # Use the previously created shared network