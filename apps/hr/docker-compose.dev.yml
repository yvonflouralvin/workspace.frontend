# docker-compose.dev.yml — app hr seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: wd_ft_hr

services:
  wd_ft_hr:
    image: node:24-alpine
    container_name: wd_ft_hr
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ../../node_modules:/app/node_modules
      - hr_next:/app/apps/hr/.next
    env_file: ./.env
    environment:
      PORT: "3003"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://wd_bk_auth:4999
      HR_API_URL: http://wd_bk_hr:5001
      GRAPHQL_API_URL: http://wd_bk_graphql:5002
      APPROVAL_FLOWS_API_URL: http://wd_bk_approval_flows:5005
    command: sh -c "[ ! -d node_modules/.bin ] && npm ci; cd apps/hr && exec npx next dev --port 3003"
    ports:
      - "3003:3003"
    networks:
      - workspace_dev

networks:
  workspace_dev:
    name: workspace_dev
    external: true

volumes:
  hr_next:
