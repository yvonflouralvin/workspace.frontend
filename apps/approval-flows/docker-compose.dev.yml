# docker-compose.dev.yml — app approval-flows seule, hot reload (next dev)
# Premier démarrage : docker compose -f docker-compose.dev.yml build
# Usage             : docker compose -f docker-compose.dev.yml up
name: ft_approval_flows

services:
  ft_approval_flows:
    build:
      context: ../../
      dockerfile: Dockerfile.dev
    container_name: dev_ft_approval_flows
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - /app/node_modules
    env_file: ./.env
    environment:
      PORT: "3006"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      APPROVAL_FLOWS_API_URL: http://dev_approval_flows:5005
    command: sh -c "cd apps/approval-flows && exec npx next dev --port 3006"
    ports:
      - "3006:3006"
    networks:
      - dev

networks:
  dev:
    name: dev
    external: true
