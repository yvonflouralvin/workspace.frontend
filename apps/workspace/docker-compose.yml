# docker-compose.yml — app workspace seule, build + start production
# Usage : docker compose up --build
name: wd_ft_workspace

services:
  wd_ft_workspace:
    image: node:24-alpine
    container_name: wd_ft_workspace
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ft_workspace_node_modules:/app/node_modules
      - ft_workspace_workspace_node_modules:/app/apps/workspace/node_modules
    env_file: ./.env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    command: >-
      sh -c "npm ci &&
      npx turbo run build --filter=workspace &&
      cp -r apps/workspace/.next/static apps/workspace/.next/standalone/apps/workspace/.next/static &&
      cp -r apps/workspace/public apps/workspace/.next/standalone/apps/workspace/public &&
      exec node apps/workspace/.next/standalone/apps/workspace/server.js"
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  ft_workspace_node_modules:
  ft_workspace_workspace_node_modules:

networks:
  dokploy-network:
    external: true