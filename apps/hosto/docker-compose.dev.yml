# docker-compose.dev.yml — app hosto seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: ft_hosto

services:
  ft_hosto:
    image: node:22-alpine
    container_name: dev_ft_hosto
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ../../node_modules:/app/node_modules
    env_file: ./.env
    environment:
      PORT: "3007"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      HOSTO_API_URL: http://dev_hosto:5007
      HR_API_URL: http://dev_hr:5001
    command: >
      sh -c "
        if [ ! -d /app/node_modules/lightningcss-linux-arm64-musl ]; then
          npm install --prefix /app lightningcss-linux-arm64-musl@$(node -p \"require('/app/node_modules/lightningcss/package.json').version\") --no-save --ignore-scripts &&
          rm -rf /app/apps/hosto/.next;
        fi;
        cd apps/hosto && exec npx next dev --port 3007
      "
    ports:
      - "3007:3007"
    networks:
      - workspace_dev

networks:
  workspace_dev:
    name: workspace_dev
    external: true
