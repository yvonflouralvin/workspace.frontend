# docker-compose.dev.yml — app stock-inventaire seule, hot reload (next dev)
# Usage : docker compose -f docker-compose.dev.yml up
name: wd_ft_stock

services:
  wd_ft_stock:
    image: node:24-alpine
    container_name: wd_ft_stock
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - ../../node_modules:/app/node_modules
    tmpfs:
      - /app/apps/stock-inventaire/.next:size=1g
    env_file: ./.env
    environment:
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://wd_bk_auth:4999
      STOCK_API_URL: http://wd_bk_stock:5009
    command: sh -c "[ ! -d node_modules/.bin ] && npm ci; cd apps/stock-inventaire && exec npx next dev --port 3010"
    ports:
      - "3010:3010"
    networks:
      - workspace_dev

networks:
  workspace_dev:
    name: workspace_dev
    external: true
