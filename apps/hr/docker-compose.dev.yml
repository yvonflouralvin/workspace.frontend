# docker-compose.dev.yml — app hr seule, hot reload (next dev)
# Premier démarrage : docker compose -f docker-compose.dev.yml build
# Usage             : docker compose -f docker-compose.dev.yml up
name: ft_hr

services:
  ft_hr:
    build:
      context: ../../
      dockerfile: Dockerfile.dev
    container_name: dev_ft_hr
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - /app/node_modules
    env_file: ./.env
    environment:
      PORT: "3003"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      HR_API_URL: http://dev_hr:5001
      GRAPHQL_API_URL: http://dev_graphql:5002
      APPROVAL_FLOWS_API_URL: http://dev_approval_flows:5005
    command: sh -c "cd apps/hr && exec npx next dev --port 3003"
    ports:
      - "3003:3003"
    networks:
      - dev

networks:
  dev:
    name: dev
    external: true
