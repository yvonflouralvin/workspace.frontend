# docker-compose.dev.yml — app approval-flows seule, hot reload (next dev)
name: ft_approval_flows
# Prérequis : docker compose -f docker-compose.postgres.dev.yml up -d (workspace root)
# Usage    : docker compose -f frontends/apps/approval-flows/docker-compose.dev.yml up

services:
  ft_approval_flows:
    image: node:24-alpine
    container_name: dev_ft_approval_flows
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - frontends_nm:/app/node_modules
    env_file: ./.env
    environment:
      PORT: "3006"
      HOSTNAME: "0.0.0.0"
      AUTH_API_URL: http://dev_auth:4999
      APPROVAL_FLOWS_API_URL: http://dev_approval_flows:5005
    command:
      - sh
      - -c
      - |
        [ ! -d node_modules/.bin ] && npm ci
        cd apps/approval-flows && exec npx next dev --port 3006
    ports:
      - "3006:3006"
    networks:
      - dev

networks:
  dev:
    name: dev
    external: true

volumes:
  frontends_nm:
    name: frontends_nm
